<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACJ Quality Portal</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.tbl{content-visibility:auto;contain-intrinsic-size:400px;-webkit-overflow-scrolling:touch}
@media print{#hdr,#toast,#pvModal,#modal{display:none!important}}
</style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

<div id="toast" class="fixed bottom-5 right-5 z-[70] translate-y-24 opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium pointer-events-none max-w-sm"></div>

<!-- LOGIN -->
<div id="login" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900">
  <form id="loginForm" class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 space-y-4">
    <div class="text-center mb-2">
      <div class="inline-flex p-3 rounded-2xl bg-indigo-600 text-white mb-3"><i data-lucide="shield-check" class="w-8 h-8"></i></div>
      <h1 class="text-2xl font-black">ACJ QUALITY PORTAL</h1>
      <p class="text-xs uppercase tracking-widest font-semibold text-indigo-600 mt-1">Claim Customer, Database NG & Inspection</p>
    </div>
    <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Username</label>
      <input id="lu" required autocomplete="username" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></div>
    <div><label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
      <input id="lp" type="password" required autocomplete="current-password" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></div>
    <div id="ts" class="flex justify-center min-h-[65px]"></div>
    <button id="lb" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl">Masuk Sistem</button>
  </form>
</div>

<!-- HEADER -->
<header id="hdr" class="hidden bg-white sticky top-0 z-40 border-b border-slate-200 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16 gap-2">
    <div class="flex items-center gap-3 min-w-0">
      <div class="p-2 rounded-xl bg-indigo-600 text-white"><i data-lucide="layers" class="w-5 h-5"></i></div>
      <div class="min-w-0"><h1 class="font-bold text-base leading-tight">ACJ Quality System</h1>
        <div class="flex items-center gap-2"><span id="role" class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase truncate"></span>
        <span id="sync" class="text-[11px] text-slate-400">Sync: --</span></div></div>
    </div>
    <div class="flex items-center gap-2">
      <button data-act="exec" class="px-3 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5"><i data-lucide="file-check-2" class="w-4 h-4 text-emerald-400"></i><span class="hidden sm:inline">Laporan Eksekutif PDF</span></button>
      <button data-act="sync" title="Sinkronkan" class="p-2 rounded-lg border border-slate-200 hover:bg-slate-50"><i data-lucide="refresh-cw" id="syncIcon" class="w-4 h-4"></i></button>
      <button data-act="logout" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg"><i data-lucide="log-out" class="w-4 h-4"></i><span class="hidden sm:inline">Logout</span></button>
    </div>
  </div>
  <nav class="max-w-7xl mx-auto px-4 pb-2 flex gap-1 overflow-x-auto" id="tabs"></nav>
</header>

<main id="app" class="hidden max-w-7xl mx-auto p-4 sm:p-6 space-y-6 pb-16"></main>
<div id="modal" class="fixed inset-0 z-[60] hidden bg-slate-900/60 backdrop-blur-sm overflow-y-auto p-4"></div>
<datalist id="dlCust"></datalist>
<div id="pvModal" class="fixed inset-0 z-[65] hidden bg-slate-900/70 backdrop-blur-sm p-3 sm:p-6">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-6xl mx-auto h-full flex flex-col overflow-hidden">
    <div class="px-4 py-3 bg-slate-900 text-white flex flex-wrap items-center justify-between gap-2">
      <h3 id="pvTitle" class="font-bold text-sm">Print Preview</h3>
      <div class="flex items-center gap-2">
        <select id="pvOrient" class="text-xs bg-slate-800 border border-slate-600 rounded-lg px-2 py-1.5"><option value="landscape">Landscape</option><option value="portrait">Portrait</option></select>
        <button data-act="pvprint" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 rounded-lg text-xs font-semibold flex items-center gap-1.5"><i data-lucide="printer" class="w-4 h-4"></i>Cetak</button>
        <button data-act="pvclose" aria-label="Tutup" class="px-2 text-slate-300 hover:text-white">✕</button>
      </div>
    </div>
    <iframe id="pvFrame" title="Print Preview" class="flex-1 w-full bg-slate-200"></iframe>
  </div>
</div>

<script>
/* ================= UTIL ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => Number(v) || 0;
const fmt = n => num(n).toLocaleString('id-ID');
const today = () => new Date().toLocaleDateString('sv-SE');
const add90 = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d+90).toLocaleDateString('sv-SE'); };
const pd = s => { if (!/^\d{4}-\d{2}-\d{2}/.test(s || '')) return null; const d = new Date(s.slice(0,10) + 'T00:00:00'); return isNaN(d) ? null : d; };
const weekOf = d => Math.ceil((d.getDate() + ((new Date(d.getFullYear(), d.getMonth(), 1).getDay() + 6) % 7)) / 7);
const icons = () => { try { lucide.createIcons(); } catch (e) {} };
const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const DIVISI = ['Bor','CNC','Cutting','Harden','Hexagon','Punch','Rolling','Turret'];
const PLANTS = ['Sangiang','Cikarang','Kalisabi','Jatake'];
const PIE_COL = ['#ef4444','#f97316','#f59e0b','#3b82f6','#8b5cf6','#94a3b8'];
let toastT;
function toast(msg, type) {
  const t = $('toast'); t.textContent = msg;
  t.className = 'fixed bottom-5 right-5 z-[70] transition-all duration-300 text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium max-w-sm pointer-events-none ' + (type === 'error' ? 'bg-rose-700' : type === 'success' ? 'bg-emerald-700' : 'bg-slate-900');
  clearTimeout(toastT); toastT = setTimeout(() => t.className += ' translate-y-24 opacity-0', 3200);
}

/* ================= STATE & CONFIG ================= */
let S = { token: null, user: null, tab: 'claim' };
const D = { claim: [], ng: [], insp: [] };
const drill = {}, pg = { claim: 1, ng: 1, insp: 1 }, charts = {}, PAGE = 15;
let editing = null, timer = null;

// kolom: [header, key, tipe (n=jumlah, p=persen, b=berkas), tampil di tabel]
const MOD = {
  claim: { title: 'Claim Customer', sheet: 'Claim_Customer', idk: 'idRegister', dk: 'tanggalClaim', color: 'indigo', icon: 'alert-octagon',
    search: ['namaCustomer','namaPart','partNomor','noClaim','idRegister','keteranganJenisNG','acjPlant'],
    cols: [['ID Register','idRegister'],['Tgl Claim','tanggalClaim'],['Plant','acjPlant'],['Kategori','kategoriClaim'],['Customer','namaCustomer'],['No Claim','noClaim'],['Nama Part','namaPart'],['Part No','partNomor'],['Jenis NG','keteranganJenisNG'],['Kategori NG','kategoriNG'],['Frekuensi Claim','frekuensiClaim'],['Qty Check','qtyCheck','n'],['Qty NG','qtyNG','n'],['% Defect','prosentase','p'],['Penyebab Problem','penyebabProblem'],['Lokasi Penemuan','lokasiPenemuan'],['Finish Monitoring','finishMonitoring'],['Status','statusClaim'],['Official Doc','officialDoc','b'],['PICA','pica','b']] },
  ng: { title: 'Database NG Internal', sheet: 'Database_NG', idk: 'idNG', dk: 'tanggal', color: 'blue', icon: 'cpu',
    search: ['namaPart','jenisNG','faktorPenyebab','divisi','noMesin','namaOperator','idNG'],
    cols: [['ID NG','idNG'],['Tanggal','tanggal'],['Nama Part','namaPart'],['Qty NG','qtyNG','n'],['Jenis Defect','jenisNG'],['Faktor Penyebab','faktorPenyebab'],['Divisi','divisi'],['No Mesin','noMesin'],['Operator','namaOperator']] },
  insp: { title: 'Data Inspection', sheet: 'Data_Inspection', idk: 'uid', dk: 'tanggal', color: 'emerald', icon: 'check-square',
    search: ['namaPart','customer','proses','operator','keterangan','no'],
    cols: [['No','no'],['Tanggal','tanggal'],['Nama Part','namaPart'],['Customer','customer'],['Proses','proses'],['Qty OK','qtyOK','n'],['Qty NG','qtyNG','n'],['Qty Repair','qtyRepair','n'],['Total Check','totalCheck','n'],['Operator','operator'],['Keterangan','keterangan']] }
};
const CH = {
  claim: [['pareto','Pareto Kategori NG (80/20)','Klik batang untuk filter log',4],['dist','','',2],['cust','Top 5 Customer','Jumlah kasus (klik untuk filter)',2],['trend','Tren Kasus & Qty NG','Bulanan',2],['plant','Claim per Plant','Klik irisan untuk filter',2],['part','Jumlah Claim per Nama Part','10 part dengan kasus terbanyak, dipisah kategori Claim & Informasi (klik batang untuk filter log)',6]],
  ng: [['pareto','Pareto Jumlah NG per Part','80/20, klik batang untuk filter',3],['pie','Top 5 Part NG Tertinggi','Proporsi 5 part kritis',3],['trend','Tren NG Satu Tahun','Per bulan & divisi (klik bulan untuk filter)',3],['multi','Pareto Multi-Dimensi','Klik batang untuk filter log',3]],
  insp: [['pareto','Pareto NG Tertinggi (80/20)','Part dengan Qty NG terbanyak',3],['pie','Top 5 Part NG Tertinggi','Proporsi defect 5 part teratas',3]]
};
const F = {
  claim: [
    {k:'idRegister',l:'ID Register (otomatis)',t:'text',ro:1},{k:'tanggalClaim',l:'Tanggal Claim',t:'date',req:1},
    {k:'acjPlant',l:'ACJ Plant',t:'sel',o:PLANTS},{k:'namaCustomer',l:'Nama Customer',t:'text',req:1,list:'dlCust'},
    {k:'noClaim',l:'No. Claim Customer',t:'text'},{k:'kategoriClaim',l:'Kategori Claim',t:'sel',o:['Claim','Informasi']},
    {k:'lokasiPenemuan',l:'Lokasi Penemuan',t:'sel',o:['Receiving Inspection','In-Process','Customer']},{k:'frekuensiClaim',l:'Frekuensi Claim',t:'sel',o:['Pertama kali','Berulang / rutin']},
    {k:'namaPart',l:'Nama Part',t:'text',req:1},{k:'partNomor',l:'Part Nomor',t:'text'},
    {k:'keteranganJenisNG',l:'Keterangan Jenis NG',t:'text',req:1,w:1},
    {k:'qtyCheck',l:'Qty Check',t:'number',min:0,def:100},{k:'qtyNG',l:'Qty NG',t:'number',min:0,def:1},
    {k:'prosentase',l:'Prosentase (%)',t:'text',ro:1},{k:'finishMonitoring',l:'Finish Monitoring (+90 hari)',t:'text',ro:1},
    {k:'kategoriNG',l:'Kategori NG',t:'sel',o:['Dimensi','Visual']},{k:'penyebabProblem',l:'Penyebab Problem',t:'sel',o:['Internal','External']},
    {k:'statusClaim',l:'Status Claim',t:'sel',o:['Monitoring','Closed']},
    {k:'officialDoc',l:'Lampiran Official Doc (PDF/JPG/PNG, maks 4 MB)',t:'file'},{k:'pica',l:'Lampiran PICA (PDF/JPG/PNG, maks 4 MB)',t:'file'}],
  ng: [
    {k:'idNG',l:'ID NG (otomatis)',t:'text',ro:1},{k:'tanggal',l:'Tanggal',t:'date',req:1},
    {k:'namaPart',l:'Nama Part',t:'text',req:1},{k:'qtyNG',l:'Qty NG (Pcs)',t:'number',min:0,req:1,def:1},
    {k:'jenisNG',l:'Jenis NG',t:'text',req:1},{k:'faktorPenyebab',l:'Faktor Penyebab',t:'text',req:1},
    {k:'divisi',l:'Divisi',t:'sel',o:DIVISI},{k:'noMesin',l:'No. Mesin',t:'text'},{k:'namaOperator',l:'Nama Operator',t:'text'}],
  insp: [
    {k:'no',l:'No (kosongkan = otomatis)',t:'text'},{k:'tanggal',l:'Tanggal',t:'date',req:1},
    {k:'namaPart',l:'Nama Part',t:'text',req:1},{k:'customer',l:'Customer',t:'text',req:1,list:'dlCust'},
    {k:'proses',l:'Proses',t:'text',req:1},{k:'operator',l:'Operator',t:'text',req:1},
    {k:'qtyOK',l:'Qty OK',t:'number',min:0,req:1,def:0},{k:'qtyNG',l:'Qty NG',t:'number',min:0,req:1,def:0},
    {k:'qtyRepair',l:'Qty Repair',t:'number',min:0,req:1,def:0},{k:'totalCheck',l:'Total Check (otomatis)',t:'text',ro:1},
    {k:'keterangan',l:'Keterangan',t:'text',w:1}]
};

/* ================= API ================= */
// >>> GANTI dengan URL Web App Apps Script Anda (hasil Deploy, berakhiran /exec) <<<
const API_URL = 'https://script.google.com/macros/s/AKfycbzM1pQqPv8Uv5hsmwkGN_x39vgKD3xu-WSv0VYhLfIWYjMHTmpQth3mmF87oDxMfct94w/exec';

// >>> GANTI dengan Site Key Cloudflare Turnstile (dashboard Cloudflare > Turnstile). Site key boleh publik. <<<
const TURNSTILE_SITEKEY = '0x4AAAAAAF_JNNxBwXPQpQm_';
let tsId = null;
function tsInit() {
  if (tsId !== null) return;
  if (!window.turnstile) return setTimeout(tsInit, 300);
  if (/GANTI_DENGAN/.test(TURNSTILE_SITEKEY)) return toast('TURNSTILE_SITEKEY di index.html belum diisi.', 'error');
  tsId = turnstile.render('#ts', {
    sitekey: TURNSTILE_SITEKEY,
    'expired-callback': () => tsReset(),
    'error-callback': () => toast('Verifikasi keamanan gagal dimuat. Muat ulang halaman.', 'error')
  });
}
const tsToken = () => (window.turnstile && tsId !== null) ? turnstile.getResponse(tsId) : '';
const tsReset = () => { try { if (window.turnstile && tsId !== null) turnstile.reset(tsId); } catch (e) {} };

function call(fn, ...args) {
  if (/GANTI_DENGAN/.test(API_URL)) return Promise.reject(new Error('API_URL di index.html belum diisi dengan URL Web App Apps Script.'));
  const payload = { fn, args: fn === 'apiLogin' ? args : [S.token, ...args] };
  // text/plain agar tidak memicu CORS preflight (Apps Script tidak mendukung OPTIONS)
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), redirect: 'follow' })
    .then(res => { if (!res.ok) throw new Error('Server error ' + res.status); return res.json(); })
    .then(r => {
      if (r && r.success === false && /Sesi/.test(r.message || '')) doLogout(true);
      return r;
    });
}

/* ================= SHELL ================= */
function kpi(label, val, sub, color, dr) {
  // dr = [modul, field, value] -> kartu bisa diklik untuk memfilter log register; dr = [modul] -> hapus filter
  let at = '', cls = '';
  if (dr) {
    const on = dr[1] ? drill[dr[0]] && drill[dr[0]].field === dr[1] && drill[dr[0]].value === dr[2] : !drill[dr[0]];
    at = `data-act="kpi" data-m="${dr[0]}" data-field="${esc(dr[1] || '')}" data-value="${esc(dr[2] || '')}" role="button" tabindex="0" title="Klik untuk menampilkan di log register"`;
    cls = 'cursor-pointer transition hover:shadow-md hover:-translate-y-0.5 ' + (on && dr[1] ? `ring-2 ring-${color}-400` : '');
  }
  return `<div ${at} class="${cls} bg-white p-4 rounded-2xl border border-slate-200 shadow-sm"><p class="text-[11px] font-semibold uppercase text-${color}-600">${label}</p><h3 class="text-2xl font-black text-${color}-700 mt-1 truncate">${val}</h3><span class="text-[11px] text-slate-400">${sub}</span></div>`;
}
function sel(m, k, label, opts) {
  return `<select id="f-${m}-${k}" data-m="${m}" class="flt text-xs bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 max-w-[200px]"><option value="ALL">${label}</option>${opts.map(([v,t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select>`;
}
function shell(m) {
  const c = MOD[m], col = c.color;
  let fl = sel(m, 'year', 'Semua Tahun', []);
  if (m === 'claim') fl += sel(m, 'customer', 'Semua Customer', []) + sel(m, 'plant', 'Semua Plant', PLANTS.map(x => [x, x])) + sel(m, 'kategori', 'Semua Kategori', [['Claim','Claim'],['Informasi','Informasi']]);
  else {
    fl += sel(m, 'month', 'Semua Bulan', MONTHS.map((x, i) => [i + 1, x])) + sel(m, 'week', 'Semua Minggu', [1,2,3,4,5].map(x => [x, 'Minggu ' + x]));
    if (m === 'insp') fl += sel(m, 'customer', 'Semua Customer', []);
    if (m === 'ng') fl += sel(m, 'divisi', 'Semua Divisi', DIVISI.map(x => [x, x]));
  }
  const cards = CH[m].map(([k, t, s, sp]) => {
    if (k === 'dist') return `<div class="lg:col-span-${sp} bg-white p-4 rounded-2xl border border-slate-200 shadow-sm"><h4 class="font-bold text-sm">Tabel Distribusi Pareto</h4><p class="text-xs text-slate-500 mb-2">Kontribusi kategori terhadap total defect</p><table class="w-full text-xs"><thead><tr class="text-slate-400 uppercase border-b"><th class="py-1 text-left">Kategori</th><th class="text-right">Qty</th><th class="text-right">%</th><th class="text-right">Kum.</th></tr></thead><tbody id="dist"></tbody></table></div>`;
    const extra = k === 'multi' ? `<select id="dim" data-m="ng" class="flt text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-lg px-2 py-1"><option value="namaPart">By Part NG</option><option value="jenisNG">By Jenis Problem</option><option value="namaOperator">By Operator</option><option value="noMesin">By No Mesin</option></select>` : '';
    return `<div class="lg:col-span-${sp} bg-white p-4 rounded-2xl border border-slate-200 shadow-sm"><div class="flex justify-between items-start gap-2 mb-2"><div><h4 class="font-bold text-sm">${t}</h4><p class="text-xs text-slate-500">${s}</p></div>${extra}</div><div class="relative h-64"><canvas id="c-${m}-${k}"></canvas></div></div>`;
  }).join('');
  const th = '<th class="py-3 px-3">Aksi</th>' + c.cols.filter(x => x[3] !== 0).map(x => `<th class="py-3 px-3 ${x[2]==='n'||x[2]==='p'?'text-right':''}">${x[0]}</th>`).join('');
  return `
  <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
    <div><h2 class="text-xl font-extrabold">${c.title}</h2><p class="text-xs text-slate-500">Dashboard, analisis Pareto & log register</p></div>
    <div class="flex items-center gap-2 flex-wrap">
      <button data-act="add" data-m="${m}" class="adm hidden px-4 py-2.5 bg-${col}-600 hover:bg-${col}-700 text-white rounded-xl text-sm font-semibold flex items-center gap-2"><i data-lucide="plus-circle" class="w-4 h-4"></i>Input Baru</button>
      <button data-act="exp" data-m="${m}" data-f="excel" class="px-3 py-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-semibold flex items-center gap-1.5"><i data-lucide="sheet" class="w-4 h-4 text-emerald-600"></i>Excel</button>
      <button data-act="exp" data-m="${m}" data-f="pdf" class="px-3 py-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-semibold flex items-center gap-1.5"><i data-lucide="file-text" class="w-4 h-4 text-rose-600"></i>PDF</button>
      <button data-act="preview" data-m="${m}" class="px-3 py-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-semibold flex items-center gap-1.5"><i data-lucide="eye" class="w-4 h-4 text-sky-600"></i>Print Preview</button>
      <button data-act="print" data-m="${m}" class="px-3 py-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-semibold flex items-center gap-1.5"><i data-lucide="printer" class="w-4 h-4 text-slate-700"></i>Print</button>
    </div></div>
  <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center gap-3">
    <span class="text-xs font-bold text-slate-600 uppercase flex items-center gap-1.5"><i data-lucide="filter" class="w-4 h-4 text-${col}-600"></i>Filter:</span>${fl}
    <button data-act="reset" data-m="${m}" class="text-xs text-slate-500 hover:text-slate-800 underline ml-auto">Reset Filter</button></div>
  <div id="kpi-${m}" class="grid grid-cols-2 ${m === 'claim' ? 'lg:grid-cols-6' : 'lg:grid-cols-4'} gap-4"></div>
  <div class="grid grid-cols-1 lg:grid-cols-6 gap-4">${cards}</div>
  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="flex items-center gap-2"><h3 class="font-bold">Log Register ${c.title}</h3>
        <span id="drill-${m}" class="hidden text-[10px] font-bold px-2.5 py-1 rounded-full bg-rose-100 text-rose-700"></span></div>

  const head = '<th>No</th>' + cols.map(x => `<th class="${x[2] === 'n' || x[2] === 'p' ? 'r' : ''}">${esc(x[0])}</th>`).join('');
  const body = rows.map((r, i) => `<tr><td class="r">${i + 1}</td>${cols.map(x => `<td class="${x[2] === 'n' || x[2] === 'p' ? 'r' : ''}">${esc(val(x, r))}</td>`).join('')}</tr>`).join('');
  const tot = cols.some(x => x[2] === 'n') ? `<tr class="tot"><td colspan="1">TOTAL</td>${cols.map(x => `<td class="r">${x[2] === 'n' ? fmt(rows.reduce((a, r) => a + num(r[x[1]]), 0)) : ''}</td>`).join('')}</tr>` : '';
  const fs = filterSummary(m), now = new Date().toLocaleString('id-ID');
  const fl = fs.length ? fs.map(([k, v]) => `<b>${esc(k)}</b>: ${esc(v)}`).join(' &nbsp;|&nbsp; ') : 'Tanpa filter (semua data)';
  const fz = cols.length > 14 ? 7 : cols.length > 10 ? 8 : 9;
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Laporan ${esc(c.title)}</title><style>
@page{size:A4 ${orient};margin:10mm}
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;color:#0f172a;margin:0;font-size:${fz}px}
${forPreview ? '@media screen{body{background:#cbd5e1;padding:16px}.sheet{background:#fff;max-width:' + (orient === 'landscape' ? '1123px' : '794px') + ';margin:0 auto;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.25)}}' : ''}
.top{border-bottom:2px solid #0f172a;padding-bottom:6px;margin-bottom:8px}
.top h1{font-size:14px;margin:0}.top h2{font-size:12px;margin:2px 0 0;color:#334155}
.meta{font-size:${fz}px;color:#475569;margin:6px 0 10px;line-height:1.6}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #94a3b8;padding:3px 5px;text-align:left;vertical-align:top;word-break:break-word}
th{background:#1e293b;color:#fff;font-size:${fz}px;text-transform:uppercase}
thead{display:table-header-group}tr{page-break-inside:avoid}
tbody tr:nth-child(even) td{background:#f1f5f9}
.r{text-align:right}.tot td{font-weight:bold;background:#e2e8f0!important}
.foot{margin-top:10px;font-size:${fz - 1}px;color:#64748b}
th,tbody tr:nth-child(even) td,.tot td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style></head><body><div class="sheet">
<div class="top"><h1>PT. ADHI CHANDRA JAYA - QUALITY ASSURANCE DEPARTMENT</h1><h2>LAPORAN ${esc(c.title.toUpperCase())}</h2></div>
<div class="meta"><b>Dicetak</b>: ${esc(now)} &nbsp;|&nbsp; <b>Oleh</b>: ${esc(by())} &nbsp;|&nbsp; <b>Jumlah Data</b>: ${rows.length}<br><b>Filter</b>: ${fl}</div>
<table><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length + 1}" style="text-align:center;padding:14px">Tidak ada data.</td></tr>`}${tot}</tbody></table>
<div class="foot">Dokumen dihasilkan oleh ACJ Quality Portal.</div>
</div></body></html>`;
}
let pv = { m: null };
function openPreview(m) {
  if (!filtered(m, true).length) return toast('Tidak ada data untuk dicetak', 'error');
  pv.m = m; $('pvTitle').textContent = 'Print Preview - ' + MOD[m].title;
  $('pvOrient').value = MOD[m].cols.length > 8 ? 'landscape' : 'portrait';
  drawPreview(); $('pvModal').classList.remove('hidden'); icons();
}
function drawPreview() { $('pvFrame').srcdoc = buildPrintHTML(pv.m, $('pvOrient').value, true); }
function printFrame(fr) {
  try { fr.contentWindow.focus(); fr.contentWindow.print(); }
  catch (e) { toast('Gagal mencetak: ' + e.message, 'error'); }
}
function directPrint(m) {
  if (!filtered(m, true).length) return toast('Tidak ada data untuk dicetak', 'error');
  const fr = document.createElement('iframe');
  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  fr.onload = () => { printFrame(fr); setTimeout(() => fr.remove(), 60000); };
  fr.srcdoc = buildPrintHTML(m, MOD[m].cols.length > 8 ? 'landscape' : 'portrait', false);
  document.body.appendChild(fr);
}

/* ================= SESI & SYNC ================= */
function enter(user, token, fresh) {
  S.user = user; S.token = token;
  try { sessionStorage.setItem('acj_sess', JSON.stringify({ user, token })); } catch (e) {}
  $('login').classList.add('hidden'); $('hdr').classList.remove('hidden'); $('app').classList.remove('hidden');
  $('role').textContent = `${user.fullName} (${user.role})`;
  $('role').className = 'text-[10px] font-bold px-2 py-0.5 rounded-full uppercase truncate ' + (user.role === 'Admin' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800');
  document.querySelectorAll('.adm').forEach(e => e.classList.toggle('hidden', user.role !== 'Admin'));
  if (fresh) toast('Selamat datang, ' + user.fullName, 'success');
  setTab(S.tab); sync();
  clearInterval(timer); timer = setInterval(() => { if (!document.hidden) sync(); }, 120000);
}
function doLogout(expired) {
  if (S.token && !expired) call('apiLogout').catch(() => {});
  clearInterval(timer); S.token = null; S.user = null;
  try { sessionStorage.removeItem('acj_sess'); } catch (e) {}
  D.claim = []; D.ng = []; D.insp = [];
  $('login').classList.remove('hidden'); $('hdr').classList.add('hidden'); $('app').classList.add('hidden'); $('loginForm').reset();
  toast(expired ? 'Sesi berakhir, silakan login ulang.' : 'Berhasil logout', 'info');
}
async function sync(manual) {
  if (!S.token) return;
  const ic = $('syncIcon'); ic.classList.add('animate-spin');
  try {
    const r = await call('apiGetAllData');
    if (r.success) {
      D.claim = r.claims || []; D.ng = r.ngRecords || []; D.insp = r.inspections || [];
      popYears(); popCustomers(r.customerList || []);
      $('sync').textContent = 'Sync: ' + new Date().toLocaleTimeString('id-ID');
      render(S.tab); if (manual) toast('Data berhasil disinkronkan!', 'success');
    } else if (!/Sesi/.test(r.message || '')) toast(r.message, 'error');
  } catch (e) { toast('Gagal sinkronisasi: ' + e.message, 'error'); }
  finally { ic.classList.remove('animate-spin'); }
}

/* ================= EVENT ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const { act, m, id, f, d, u } = b.dataset;
  if (act === 'tab') setTab(m);
  else if (act === 'kpi') {
    const { field, value } = b.dataset, cur = drill[m];
    if (!field || (cur && cur.field === field && cur.value === value)) { drill[m] = null; badge(m); pg[m] = 1; table(m); }
    else setDrill(m, field, value);
    if (m === 'claim') rClaim();
  }
  else if (act === 'add') openForm(m);
  else if (act === 'edit') { const r = D[m].find(x => x[MOD[m].idk] === id); if (r) openForm(m, r); }
  else if (act === 'del') {
    if (!confirm('Yakin menghapus data ini? Tindakan tercatat di Audit Log.')) return;
    call('apiDelete', m, id).then(r => { toast(r.message, r.success ? 'success' : 'error'); if (r.success) sync(); }).catch(er => toast('Gagal hapus: ' + er.message, 'error'));
  }
  else if (act === 'exp') exportData(m, f);
  else if (act === 'preview') openPreview(m);
  else if (act === 'print') directPrint(m);
  else if (act === 'pvprint') printFrame($('pvFrame'));
  else if (act === 'pvclose') { $('pvModal').classList.add('hidden'); $('pvFrame').srcdoc = ''; }
  else if (act === 'exec') execReport();
  else if (act === 'sync') sync(true);
  else if (act === 'logout') doLogout(false);
  else if (act === 'close') $('modal').classList.add('hidden');
  else if (act === 'doc') openDoc(u);
  else if (act === 'pg') { pg[m] += Number(d); table(m); }
  else if (act === 'cdrill') { drill[m] = null; badge(m); pg[m] = 1; table(m); if (m === 'claim') rClaim(); }
  else if (act === 'reset') {
    document.querySelectorAll(`#v-${m} select.flt`).forEach(s => s.value = 'ALL'); $('q-' + m).value = ''; drill[m] = null; badge(m); pg[m] = 1; render(m); toast('Filter di-reset', 'info');
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'pvOrient') return drawPreview();
  if (!e.target.classList.contains('flt')) return;
  const m = e.target.dataset.m; pg[m] = 1; render(m);
});
let qT; document.addEventListener('input', e => {
  if (!e.target.classList.contains('srch')) return;
  const m = e.target.dataset.m; clearTimeout(qT); qT = setTimeout(() => { pg[m] = 1; render(m); }, 250);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const cf = tsToken();
  if (!cf) return toast('Selesaikan verifikasi keamanan terlebih dahulu.', 'error');
  const b = $('lb'); b.disabled = true; b.textContent = 'Memverifikasi...';
  try {
    const r = await call('apiLogin', $('lu').value.trim(), $('lp').value, cf);
    if (r.success) enter(r.user, r.token, true); else toast(r.message, 'error');
  } catch (err) { toast('Gagal login: ' + err.message, 'error'); }
  finally { b.disabled = false; b.textContent = 'Masuk Sistem'; tsReset(); }
});
window.addEventListener('load', () => {
  buildApp(); icons(); tsInit();
  try { const s = JSON.parse(sessionStorage.getItem('acj_sess') || 'null'); if (s && s.token && s.user) enter(s.user, s.token, false); } catch (e) {}
});
</script>
</body>
